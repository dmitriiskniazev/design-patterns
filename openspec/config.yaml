schema: spec-driven
context: |
  Русскоязычный курс паттернов проектирования для уверенно пишущего на Python разработчика.
  Только Python >=3.15, uv, pyproject.toml, uv.lock, пакет src/design_patterns и pytest.
  Все23 GoF-паттерна и2 подхода Repository и Dependency Injection; последние вне GoF.
  Примеры максимально абстрактны: канонические роли, нейтральные значения1/A/B, одна операция и одно расширение.
  Предметных моделей, бизнес-логики, SDK, SQL и валидации ради демонстрации нет.
  Различия объясняются обязанностями, зависимостями и подстановкой, а не сюжетами.
  Корректные варианты до и после имеют одинаковый вход, возможности и результат.
  Каждая тема содержит четыре исполняемых набора fileComparison и проверки свойств.
  Все исходники темы плоские в examples/<pattern>/python/; связанные варианты вместе в ролевых модулях, запуск отдельно.
  Входы with_pattern.py, with_pattern_extended.py, without_pattern.py, without_pattern_extended.py.
  Для закрытого выбора используйте StrEnum и match; явные типы и читаемое форматирование сохраняются.
  Все25 глав: вкладки Объяснение/Примеры/Полная реализация; два коротких сравнения≤12 непустых строк.
  Термины и причины ролей раскрываются; схема компактная≤800px; оформление и подсветка Verdandi / Verdandi Alter.
  Все полные файлы открыты сразу от входа к зависимостям; две оси сравнения: без/с паттерном или без/с расширением; одинаковый код показан один раз, если порядок и diff совместимы.
  В расширении один переключатель Изменения показывает diff с базой той же стороны; копируется текущий исполняемый код.
  Старые отсутствующие имена файлов переходят к актуальному входу выбранного режима.
  sourceFiles, steps и guide извлекают код из тех же файлов, которые запускают инфраструктурные проверки.
  Команды: uv run build-course, uv run test-course, uv run pytest, uv run python -m http.server.
  test-course автоматически проверяет каждый каталог темы отдельным процессом.
  Меняйте исходники и пересобирайте assets/course-data.js; не редактируйте сгенерированный файл вручную.
  Только README.md и AGENTS.md из Markdown в корне; историю сохраняйте в OpenSpec.
  Проверки браузера — внешними инструментами; отсутствие браузера указывайте явно.
rules:
  specs:
    - Описывайте наблюдаемое поведение и проверяемые сценарии, а не внутренние детали реализации.
  tasks:
    - Отмечайте задачи выполненными после реализации и соответствующей проверки.
