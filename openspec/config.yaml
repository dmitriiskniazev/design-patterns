schema: spec-driven
context: |
  Русскоязычный курс паттернов проектирования для уверенно пишущего на Python разработчика.
  Только Python >=3.15, uv, pyproject.toml, uv.lock, пакет src/design_patterns и pytest.
  Все23 GoF-паттерна и2 подхода Repository и Dependency Injection; последние вне GoF.
  Примеры максимально абстрактны: канонические роли, нейтральные значения1/A/B, одна операция и одно расширение.
  Предметных моделей, бизнес-логики, SDK, SQL и валидации ради демонстрации нет.
  Различия объясняются обязанностями, зависимостями и подстановкой, а не сюжетами.
  Корректные варианты до и после имеют одинаковый вход, возможности и результат.
  Каждая тема содержит четыре исполняемых набора fileComparison и проверки свойств.
  Каждая тема имеет examples/<pattern>/{base,extended}/{without_pattern,with_pattern}/ без уровня python.
  В каждом варианте main.py, локальные ролевые модули и test_example.py; импорты соседних вариантов запрещены.
  База не содержит новых участников расширения заранее; неизменившийся небольшой код повторяется в автономных папках.
  Для закрытого выбора используйте StrEnum и match; явные типы и читаемое форматирование сохраняются.
  Все25 глав: режимы Разбор/Код; цельные короткие сравнения≤12 непустых строк, схема и роли по запросу.
  Термины и причины ролей раскрываются; схема компактная≤800px; оформление и подсветка Verdandi / Verdandi Alter.
  Код на высоту окна: одна смысловая пара baseline/pattern, список обязанностей, реальные пути, один выбор этапа основной/расширенный. Пары guide.filePairs задаются явно; все файлы достижимы. Общий идентичный код один раз.
  Общая вертикальная прокрутка, выровненные строки; на узкой доступной области переключатель стороны с сохранением позиции. Изменения подсвечивают baseline/pattern по умолчанию; копируется точный исходник. Запуск и метаданные по запросу.
  Старые отсутствующие имена файлов переходят к актуальному входу выбранного режима.
  sourceFiles, steps и guide извлекают код из тех же файлов, которые запускают инфраструктурные проверки.
  Команды: uv run build-course, uv run test-course, uv run pytest, uv run python -m http.server.
  test-course автоматически проверяет каждый вариант отдельным процессом; необязательный аргумент выбирает тему.
  Материалы и интерфейс хранятся в web/; web/lessons.json содержит главы и ссылки на Python.
  uv run build-course создаёт только .build/site; результаты сборки не хранятся в Git. ZIP и каталоги assets/content отсутствуют.
  Только README.md и AGENTS.md из Markdown в корне; историю сохраняйте в OpenSpec.
  Проверки браузера — внешними инструментами; отсутствие браузера указывайте явно.
  Пилот Abstract Factory заменяет старые правила для одной главы: examples/abstract_factory, общие formats/ и interfaces.py, baseline/ и pattern/, один test_example.py. JSON/YAML/TOML через реальные библиотеки, dict[str, str], Protocol без наследования, write_and_read. Только две версии; добавление TOML объясняется по конечным исходникам. URL abstract-factory сохраняется. Остальные главы пока без изменений.
  Abstract Factory также показывает Validator во всех трёх семействах, create_validator во всех фабриках и новый validate_and_read; общая проверка в validation.py. В этой главе три парных сравнения, объясняющие оба направления расширения и цену двойного разбора.
  Strategy также использует две конечные версии: baseline/{operations,context,main}.py, pattern/{interfaces,strategies,context,main}.py и общий test_example.py. Add/Multiply/Constant — frozen dataclass, Strategy — Protocol.apply(int)->int. Context.apply_all обходит список; настройки, замена и внешний алгоритм проверяются тестом. Constant объясняется по конечному коду; смена контракта — текстом.
  Интерфейс: web/src содержит адаптеры курса; общие настройки, темы, шрифты и компоненты поставляет зафиксированный course-engine из vendor/.22 темы для страницы и кода,9 локальных гарнитур с лицензиями и cmap-проверкой. Боковая панель с4 группами и импортом VS Code JSONC/Python overrides/preview; settings/schema — defaults/normalize. Исходники запускаются как ES-модули через HTTP или установленную офлайн-копию.
  Разбор и Код используют одну оболочку: каталог виден от960px в обоих режимах, на узком экране открывается поверх материала. Заголовки исходников общие, с обозначением стороны и полным путём. Разбор по умолчанию использует всю доступную ширину для сравнений; длина строк пояснений ограничена отдельно. Условия задач сначала объясняют поведение, отдельно называют исходные данные и ожидаемый результат; упражнения содержат действие и проверку.
rules:
  specs:
    - Описывайте наблюдаемое поведение и проверяемые сценарии, а не внутренние детали реализации.
  tasks:
    - Отмечайте задачи выполненными после реализации и соответствующей проверки.
