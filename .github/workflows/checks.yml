name: Check course
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.15'
      - run: uv sync --locked
      - run: uv run --locked test-course
      - run: uv run --locked build-course
