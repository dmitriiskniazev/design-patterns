[project]
name = "design-patterns"
version = "0.1.0"
description = "Русскоязычный курс паттернов проектирования на Python"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["pygments==2.21.0"]

[project.scripts]
build-site = "design_patterns.site:main"
build-course = "design_patterns.build:main"
test-course = "design_patterns.check:main"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
